name: Release

# Publishes to npm when a `v*` tag is pushed (or via manual dispatch).
# The pushed tag IS the source of truth for the version: the workflow
# reads `vX.Y.Z` off the tag and writes it into package.json before
# publishing, so you never have to bump package.json by hand — just
# `git tag vX.Y.Z && git push --tags`.
# Requires the `NPM_TOKEN` repo secret (an npm automation or granular
# publish token). Uses provenance (signed package attestation), so the
# npm account must have 2FA enabled and the repo must be public.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for --provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"   # e.g. v0.1.2
          VERSION="${TAG#v}"               # e.g. 0.1.2
          # `npm version` validates semver and refuses garbage; --no-git-tag-version
          # keeps it from trying to commit/tag inside CI.
          npm version "$VERSION" --no-git-tag-version
          echo "Publishing pi-mulligan@$VERSION (from tag $TAG)"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}