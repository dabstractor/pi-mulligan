name: Release

# Publishes to npm when a `v*` tag is pushed (or via manual dispatch).
# Requires the `NPM_TOKEN` repo secret (an npm automation or granular
# publish token). Uses provenance (signed package attestation), so the
# npm account must have 2FA enabled and the repo must be public.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for --provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG=$(node -p "require('./package.json').version")
          if [ "v$PKG" != "$TAG" ]; then
            echo "::error::Git tag '$TAG' does not match package.json version 'v$PKG'"
            exit 1
          fi
          echo "Publishing pi-mulligan@$PKG (from tag $TAG)"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}